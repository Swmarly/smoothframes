name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish self-contained x64 app
        run: dotnet publish .\src\SmoothFrames\SmoothFrames.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o .\artifacts\publish
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path .\artifacts\publish\* -DestinationPath .\artifacts\SmoothFrames-win-x64.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/SmoothFrames-win-x64.zip
          generate_release_notes: true
