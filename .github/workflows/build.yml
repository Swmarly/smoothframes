name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build .\src\SmoothFrames\SmoothFrames.csproj -c Release
      - name: Publish self-contained x64 app
        run: dotnet publish .\src\SmoothFrames\SmoothFrames.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o .\artifacts\publish
      - uses: actions/upload-artifact@v4
        with:
          name: SmoothFrames-win-x64
          path: artifacts/publish/SmoothFrames.exe
          if-no-files-found: error
