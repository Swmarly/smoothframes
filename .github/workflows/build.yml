name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build and test native engines, publish self-contained app
        shell: pwsh
        run: ./scripts/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: SmoothFrames-win-x64
          path: artifacts/SmoothFrames-win-x64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: SmoothFrames-ui-smoke
          path: artifacts/ui-smoke.png
          if-no-files-found: error
